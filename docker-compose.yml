services:
  gsea:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - gsea_data:/app/data
      - gsea_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gsea_data:
  gsea_uploads:
